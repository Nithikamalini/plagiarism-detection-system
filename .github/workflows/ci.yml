name: Plagiarism System CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up OpenJDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile Application Sources
      run: |
        mkdir -p bin
        javac --release 17 -encoding UTF-8 -cp "lib/*" -d bin $(find src/main/java -name "*.java")

    - name: Run Algorithmic Verification Suite
      run: |
        java -cp "bin:lib/*" com.plagiarism.PlagiarismEngineTest
