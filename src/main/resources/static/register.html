<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Plagiarism Detection System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <div class="brand-icon">🔍</div>
        <div class="brand-title">Plagio<span>Guard</span></div>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="scan.html" class="nav-link">Check Text</a></li>
      </ul>
      <div id="nav-user-container">
        <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </nav>

  <main class="container" style="display:flex; align-items:center; justify-content:center; flex:1; padding: 40px 20px;">
    <div class="card" style="max-width: 480px; width: 100%;">
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-size: 1.75rem; margin-bottom: 8px;">Create Account</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Join the PlagioGuard similarity detection platform</p>
      </div>

      <div id="auth-error" style="display:none; background: var(--danger-bg); border: 1px solid var(--danger); color: #fca5a5; padding: 12px; border-radius: var(--radius-sm); margin-bottom: 20px; font-size: 0.9rem;"></div>

      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-control" placeholder="Alex Johnson" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="alex@university.edu" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Choose a username" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Create Account</button>
      </form>

      <p style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--secondary); text-decoration: none; font-weight: 600;">Sign In</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">Plagiarism Detection System &copy; 2026</div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
