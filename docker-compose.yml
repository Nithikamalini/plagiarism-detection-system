version: '3.8'

services:
  # MongoDB Database Service
  mongo:
    image: mongo:8.0
    container_name: plagiarism-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: plagiarism_db
    volumes:
      - mongo-data:/data/db

  # Java Web Backend & Frontend Service
  app:
    build: .
    container_name: plagiarism-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - mongodb.uri=mongodb://mongo:27017/plagiarism_db
    depends_on:
      - mongo

volumes:
  mongo-data:
    driver: local
