<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Plagiarism Detection System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <div class="brand-icon">🔍</div>
        <div class="brand-title">Plagio<span>Guard</span></div>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="scan.html" class="nav-link">Check Text</a></li>
      </ul>
      <div id="nav-user-container">
        <a href="register.html" class="btn btn-outline btn-sm">Register</a>
      </div>
    </div>
  </nav>

  <main class="container" style="display:flex; align-items:center; justify-content:center; flex:1; padding: 40px 20px;">
    <div class="card" style="max-width: 460px; width: 100%;">
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-size: 1.75rem; margin-bottom: 8px;">Welcome Back</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to your PlagioGuard account</p>
      </div>

      <div id="auth-error" style="display:none; background: var(--danger-bg); border: 1px solid var(--danger); color: #fca5a5; padding: 12px; border-radius: var(--radius-sm); margin-bottom: 20px; font-size: 0.9rem;"></div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter your username" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Sign In</button>
      </form>

      <!-- Quick Demo Accounts -->
      <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border);">
        <p style="font-size: 0.8rem; color: var(--text-muted); text-align: center; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em;">
          One-Click Demo Credentials
        </p>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
          <button type="button" class="btn btn-outline btn-sm" onclick="fillDemo('admin', 'admin123')">Admin</button>
          <button type="button" class="btn btn-outline btn-sm" onclick="fillDemo('student', 'student123')">Student</button>
          <button type="button" class="btn btn-outline btn-sm" onclick="fillDemo('professor', 'prof123')">Professor</button>
        </div>
      </div>

      <p style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="color: var(--secondary); text-decoration: none; font-weight: 600;">Create one</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">Plagiarism Detection System &copy; 2026</div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
